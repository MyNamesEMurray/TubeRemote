# Uploads AppStore/screenshots to the editable App Store version, replacing whatever is in its 6.9" iPhone and 13" iPad
# sets (en-US). Run by hand only: it overwrites screenshots added in App Store Connect.
name: Upload Screenshots
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.exaltedpixels.TubeRemote
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          for pair in "iphone-6.9:APP_IPHONE_67" "ipad-13:APP_IPAD_PRO_3GEN_129"; do
            DIR="${pair%%:*}"
            export DISPLAY_TYPE="${pair##*:}"
            rm -rf upload && mkdir -p upload/en-US
            cp "AppStore/screenshots/$DIR/controls.png" upload/en-US/1-controls.png
            cp "AppStore/screenshots/$DIR/queue.png" upload/en-US/2-queue.png
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/upload_app_store_screenshots.py upload
          done
