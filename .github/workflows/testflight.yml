# Builds, signs and uploads the app to TestFlight.
#
# Signing must not create a certificate per run. A fresh runner has no private keys, so if
# xcodebuild signs the archive it asks Apple for a new certificate every time, and the account
# soon fails with "Your account has reached the maximum number of certificates."
# Two things prevent that (the same fixes used in LensLink and Buildplate):
#   1. The archive is built unsigned. Only the export step signs, with a distribution profile.
#   2. Optional but recommended: bring one distribution certificate as secrets, so the export
#      step reuses it instead of asking Apple for anything:
#        APPLE_DISTRIBUTION_CERT_P12       base64 of the .p12
#        APPLE_DISTRIBUTION_CERT_PASSWORD  its export password
#      A distribution certificate belongs to the team, not the app, so the one made for
#      Buildplate (scripts/ios-signing-cert.mjs there) works here too.
#
# Other secrets: ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-latest
    # Two uploads at once collide in App Store Connect, and a newer run makes an older one
    # pointless, so starting a run cancels the one in progress.
    concurrency:
      group: testflight
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          # Pick whichever iPhone simulator this runner image has, newest iOS first.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; r=json.load(sys.stdin)['devices']; print(next(d['udid'] for k in sorted(r, reverse=True) if 'iOS' in k for d in r[k] if 'iPhone' in d['name']))")
          xcodebuild test -project TubeRemote.xcodeproj -scheme TubeRemote \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf "%s\n" "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::APPLE_DISTRIBUTION_CERT_P12 is not set. The export step will rely on Apple's managed signing; add the secret to guarantee no certificate is ever created by a run."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without a partition list codesign waits on a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # xcodebuild only searches the user list, and -s replaces it, so name the existing ones again.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          if security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "0 valid identities found"; then
            echo "The .p12 imported but holds no code-signing identity." >&2
            exit 1
          fi
      - name: Archive (unsigned)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A tag like v1.2 sets the app version to 1.2; other runs keep the version from project.yml.
          VERSION=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=(MARKETING_VERSION="${GITHUB_REF_NAME#v}"); fi
          # Signing here would make Apple issue a new development certificate on every run.
          xcodebuild archive -project TubeRemote.xcodeproj -scheme TubeRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TubeRemote.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${VERSION[@]}"
      - name: Put the entitlements into the archive
        run: |
          # An unsigned archive carries no entitlements, so export would sign the app and its extension without the
          # App Group. Export reads them from archived-expanded-entitlements.xcent in each bundle, so provide that.
          A="$RUNNER_TEMP/TubeRemote.xcarchive/Products/Applications/TubeRemote.app"
          cp Config/TubeRemote.entitlements "$A/archived-expanded-entitlements.xcent"
          cp Config/TubeRemoteShare.entitlements "$A/PlugIns/TubeRemoteShare.appex/archived-expanded-entitlements.xcent"
          cat "$A/archived-expanded-entitlements.xcent" "$A/PlugIns/TubeRemoteShare.appex/archived-expanded-entitlements.xcent"
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TubeRemote.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # The keychain holds a private key; never leave it behind.
      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
