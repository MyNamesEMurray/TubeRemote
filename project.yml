name: TubeRemote
options:
  bundleIdPrefix: com.exaltedpixels
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  TubeRemote:
    type: application
    platform: iOS
    sources: [Sources, Assets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exaltedpixels.TubeRemote
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TubeRemote
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Find and control your other devices running TubeRemote on your Wi-Fi network.
        NSBonjourServices: ["_ytremote._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  TubeRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TubeRemote
schemes:
  TubeRemote:
    build:
      targets:
        TubeRemote: all
    test:
      targets: [TubeRemoteTests]
