name: TubeRemote
options:
  bundleIdPrefix: com.exaltedpixels
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  TubeRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: TubeRemoteShare
      - target: TubeRemoteNowPlaying
    entitlements:
      path: Config/TubeRemote.entitlements
      properties:
        com.apple.security.application-groups: [group.com.exaltedpixels.TubeRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exaltedpixels.TubeRemote
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TubeRemote
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Find and control your other devices running TubeRemote on your Wi-Fi network.
        NSBonjourServices: ["_ytremote._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # Share > Send to Viewer: sends a YouTube link to a paired viewer. It compiles the app's protocol code and reads the
  # paired devices the app mirrors into the shared App Group container (Sources/SharedConfig.swift).
  TubeRemoteShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Models.swift
      - path: Sources/Transport.swift
      - path: Sources/Log.swift
      - path: Sources/SharedConfig.swift
    entitlements:
      path: Config/TubeRemoteShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.exaltedpixels.TubeRemote]
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: Send to Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Find and send videos to your viewers on your Wi-Fi network.
        NSBonjourServices: ["_ytremote._tcp"]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exaltedpixels.TubeRemote.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  # Now Playing: shows the viewer's playback on the remote's Lock Screen and Control Center (iOS 27) and sends the
  # system's play, pause, skip, seek and volume commands to it. It signs in to the viewer the way the Share extension does.
  TubeRemoteNowPlaying:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - NowPlayingExtension
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Models.swift
      - path: Sources/Transport.swift
      - path: Sources/Log.swift
      - path: Sources/SharedConfig.swift
      - path: Sources/NowPlayingShared.swift
    entitlements:
      path: Config/TubeRemoteNowPlaying.entitlements
      properties:
        com.apple.security.application-groups: [group.com.exaltedpixels.TubeRemote]
    info:
      path: Config/NowPlaying-Info.plist
      properties:
        CFBundleDisplayName: TubeRemote Now Playing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Find and control your viewers on your Wi-Fi network from the Lock Screen.
        NSBonjourServices: ["_ytremote._tcp"]
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.nowplaying.remote-media
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exaltedpixels.TubeRemote.NowPlaying
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  TubeRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TubeRemote
schemes:
  TubeRemote:
    build:
      targets:
        TubeRemote: all
    test:
      targets: [TubeRemoteTests]
